<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>포켓 게임천국</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#f5f7ff;background:#0b1021}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#293563 0,transparent 42%),#0b1021}button{font:inherit;cursor:pointer}header{max-width:960px;margin:auto;padding:34px 22px 18px}h1{font-size:clamp(30px,6vw,52px);margin:8px 0}p{color:#aebbd8}.pill{display:inline-block;background:#28365e;color:#c8d9ff;padding:7px 12px;border-radius:99px;font-size:12px}.grid{max-width:960px;margin:0 auto;padding:14px 22px 60px;display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{border:1px solid #39486d;border-radius:24px;padding:22px;background:linear-gradient(145deg,#202d50,#141d35);text-align:left;color:white;min-height:215px;transition:transform .15s}.card:hover{transform:translateY(-4px)}.icon{font-size:45px}.card h2{margin:10px 0 6px}.card small{color:#b6c5e4}.tag{display:block;color:#84e8cb;margin-top:18px;font-size:13px}.overlay{position:fixed;inset:0;background:#070c19ee;display:none;z-index:5;align-items:center;justify-content:center;padding:12px}.overlay.active{display:flex}.panel{width:min(100%,470px);height:min(95dvh,780px);background:#111a31;border:1px solid #40517d;border-radius:22px;display:flex;flex-direction:column;overflow:hidden}.bar{padding:13px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px}.bar strong{font-size:17px}.bar button,.action{border:0;border-radius:12px;padding:10px 14px;background:#34446c;color:#fff}.stats{display:flex;justify-content:space-between;padding:0 17px 12px;color:#c3d4ef;font-size:14px}canvas{display:block;width:100%;flex:1;min-height:0;background:#10192f;touch-action:none}.bottom{padding:12px;display:flex;gap:10px;align-items:center;justify-content:center}.action{background:#6c70f5;font-weight:700;min-width:120px}.hint{font-size:12px;text-align:center;color:#9caed0}.pad{display:flex;gap:16px}.pad button{border:0;background:#293d68;color:white;border-radius:12px;width:72px;height:46px;font-size:22px}.hide{display:none!important}@media(max-width:580px){.grid{grid-template-columns:1fr}.card{min-height:175px}header{padding-top:24px}}
</style></head><body><header><span class="pill">🎮 4 IN 1 · MOBILE ARCADE</span><h1>포켓 게임천국 ✨</h1><p>짧게 한 판! 설치 없이 바로 즐기는 네 가지 미니게임.</p></header><main class="grid" id="cards"></main><div class="overlay" id="overlay"><div class="panel"><div class="bar"><strong id="gameTitle"></strong><button id="close">✕ 나가기</button></div><div class="stats"><span id="score">점수 0</span><span id="best">최고 0</span></div><canvas id="game"></canvas><div class="bottom"><div class="pad hide" id="pad"><button id="left">◀</button><button id="right">▶</button></div><button class="action" id="start">시작하기</button></div><div class="hint" id="hint" style="padding-bottom:12px"></div></div></div><script>
const games=[{name:'별빛 대시',icon:'🚀',desc:'운석을 피하고 반짝이는 별을 모으세요.',tag:'피하기 · 생존',hint:'손가락으로 좌우 이동 · PC는 방향키'},{name:'버블 팡',icon:'🫧',desc:'튀어 오르는 버블을 빠르게 터뜨리세요.',tag:'반응속도 · 터치',hint:'버블을 터치하거나 클릭 · 30초 제한'},{name:'코인 캐처',icon:'🪙',desc:'바구니로 코인을 받고 폭탄은 피하세요.',tag:'캐치 · 집중력',hint:'손가락으로 바구니 이동 · PC는 방향키'},{name:'스네이크 스낵',icon:'🐍',desc:'먹이를 먹으며 길어지는 뱀을 조종하세요.',tag:'클래식 · 전략',hint:'스와이프 또는 방향키 · 벽과 몸을 피하세요'}];
const $=id=>document.getElementById(id);$('cards').innerHTML=games.map((g,i)=>`<button class="card" data-id="${i}"><div class="icon">${g.icon}</div><h2>${g.name}</h2><small>${g.desc}</small><span class="tag">${g.tag} →</span></button>`).join('');
const canvas=$('game'),ctx=canvas.getContext('2d');let W=400,H=540,mode=0,active=false,score=0,elapsed=0,last=0,objects=[],player={x:200,y:480},snake=[],food={},dir={x:1,y:0},nextDir={x:1,y:0},step=0,pointerDown=false,raf=0;
function resize(){let r=canvas.getBoundingClientRect();W=r.width;H=r.height;canvas.width=Math.round(W*devicePixelRatio);canvas.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
function bestKey(){return 'pocket_arcade_best_'+mode}function hud(){$('score').textContent='점수 '+score;$('best').textContent='최고 '+(localStorage.getItem(bestKey())||0)}function finish(){active=false;$('start').textContent='다시 도전';if(score>+(localStorage.getItem(bestKey())||0))localStorage.setItem(bestKey(),score);hud();drawMessage('게임 종료!','점수 '+score+' · 다시 도전해 보세요')}
function openGame(i){mode=i;$('overlay').classList.add('active');$('gameTitle').textContent=games[i].icon+' '+games[i].name;$('hint').textContent=games[i].hint;$('pad').classList.toggle('hide',i===1||i===3);$('start').textContent='시작하기';active=false;score=0;hud();resize();drawMessage(games[i].name,'시작하기를 눌러주세요')}
function drawMessage(a,b){ctx.fillStyle='#10192f';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='white';ctx.font='bold 26px system-ui';ctx.fillText(a,W/2,H/2-14);ctx.font='14px system-ui';ctx.fillStyle='#aebbd8';ctx.fillText(b,W/2,H/2+20)}
function start(){cancelAnimationFrame(raf);resize();active=true;score=0;elapsed=0;last=performance.now();objects=[];player={x:W/2,y:H-52};step=0;snake=[{x:7,y:9},{x:6,y:9},{x:5,y:9}];dir={x:1,y:0};nextDir={...dir};spawnFood();$('start').textContent='진행 중';hud();raf=requestAnimationFrame(loop)}
function spawnFood(){let cols=20,rows=Math.max(10,Math.floor(H/(W/cols)));do{food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function loop(now){if(!active)return;let dt=Math.min(.04,(now-last)/1000);last=now;elapsed+=dt;ctx.clearRect(0,0,W,H);ctx.fillStyle='#10192f';ctx.fillRect(0,0,W,H);
if(mode===0||mode===2){let rate=mode===0?Math.max(.23,.72-elapsed*.007):Math.max(.24,.6-elapsed*.006);if(!objects.length||elapsed-objects[objects.length-1].born>rate){objects.push({x:20+Math.random()*(W-40),y:-25,born:elapsed,bad:Math.random()<(mode===0?.7:.27),r:mode===0?15:14})}for(let o of objects){o.y+=(160+elapsed*3)*dt;circle(o.x,o.y,o.r,o.bad?'#ff667f':'#ffcf59');if(Math.abs(o.x-player.x)<(mode===0?27:39)&&Math.abs(o.y-player.y)<29){if(o.bad){finish();return}else{score+=10;hud();o.y=H+100}}}objects=objects.filter(o=>o.y<H+35);if(mode===0){ctx.font='34px system-ui';ctx.textAlign='center';ctx.fillText('🚀',player.x,player.y+11)}else{roundRect(player.x-32,player.y-9,64,23,8,'#71e8cc');roundRect(player.x-26,player.y-15,52,10,5,'#d9fff2')}}
if(mode===1){if(elapsed>=30){finish();return}if(!objects.length||elapsed-objects[objects.length-1].born>.43){objects.push({x:30+Math.random()*(W-60),y:60+Math.random()*(H-110),r:22+Math.random()*14,born:elapsed,life:1.3})}objects.forEach(o=>{o.life-=dt;circle(o.x,o.y,o.r,'#79d8ff');circle(o.x-o.r*.25,o.y-o.r*.28,o.r*.24,'#e4f9ff')});objects=objects.filter(o=>o.life>0);ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.textAlign='left';ctx.fillText('남은 시간 '+Math.ceil(30-elapsed)+'초',16,30)}
if(mode===3){let cell=W/20,rows=Math.floor(H/cell);step+=dt;if(step>.135){step=0;dir=nextDir;let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=20||head.y<0||head.y>=rows||snake.some((s,i)=>i<snake.length-1&&s.x===head.x&&s.y===head.y)){finish();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;hud();spawnFood()}else snake.pop()}for(let x=0;x<20;x++)for(let y=0;y<rows;y++)if((x+y)%2===0)roundRect(x*cell,y*cell,cell,cell,0,'#14213c');circle((food.x+.5)*cell,(food.y+.5)*cell,cell*.38,'#ffbf63');snake.forEach((s,i)=>roundRect(s.x*cell+1,s.y*cell+1,cell-2,cell-2,5,i?'#5bceac':'#a5ffe0'))}
raf=requestAnimationFrame(loop)}
function move(x){player.x=Math.max(32,Math.min(W-32,x))}function position(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{let p=position(e);pointerDown=true;canvas.setPointerCapture(e.pointerId);if(!active)return;if(mode===1){let hit=objects.findIndex(o=>Math.hypot(o.x-p.x,o.y-p.y)<o.r+7);if(hit>=0){objects.splice(hit,1);score+=10;hud()}}else if(mode===3){canvas._swipe=p}else move(p.x)});canvas.addEventListener('pointermove',e=>{if(pointerDown&&active&&(mode===0||mode===2))move(position(e).x)});canvas.addEventListener('pointerup',e=>{pointerDown=false;if(mode===3&&active&&canvas._swipe){let p=position(e),dx=p.x-canvas._swipe.x,dy=p.y-canvas._swipe.y;if(Math.max(Math.abs(dx),Math.abs(dy))>18)changeDir(Math.abs(dx)>Math.abs(dy)?(dx>0?'ArrowRight':'ArrowLeft'):(dy>0?'ArrowDown':'ArrowUp'));canvas._swipe=null}});
function changeDir(k){let d={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}}[k];if(!d)return;if(mode===3){if(d.x!==-dir.x||d.y!==-dir.y)nextDir=d}else if(mode===0||mode===2)move(player.x+d.x*38)}document.addEventListener('keydown',e=>{if(!$('overlay').classList.contains('active'))return;if(e.key.startsWith('Arrow')){e.preventDefault();changeDir(e.key)}});let held=0;['left','right'].forEach(id=>{let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();changeDir(id==='left'?'ArrowLeft':'ArrowRight');clearInterval(held);held=setInterval(()=>changeDir(id==='left'?'ArrowLeft':'ArrowRight'),80)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>clearInterval(held)))});
$('cards').addEventListener('click',e=>{let card=e.target.closest('[data-id]');if(card)openGame(+card.dataset.id)});$('start').onclick=()=>{if(!active)start()};$('close').onclick=()=>{active=false;cancelAnimationFrame(raf);$('overlay').classList.remove('active')};window.addEventListener('resize',()=>{if($('overlay').classList.contains('active')&&!active){resize();drawMessage(games[mode].name,'시작하기를 눌러주세요')}});
</script></body></html>
