<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10152c"><title>별빛 대시</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1024;color:white;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:18px 20px;display:flex;justify-content:space-between;font-weight:800;font-size:18px;pointer-events:none}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#090e21b8;backdrop-filter:blur(7px)}.card{width:min(88vw,370px);padding:30px 22px;border:1px solid #ffffff30;border-radius:24px;background:#182344;text-align:center;box-shadow:0 20px 70px #0008}h1{font-size:34px;margin:0 0 12px}p{line-height:1.7;color:#c9d5f4}button{border:0;background:linear-gradient(120deg,#5eead4,#60a5fa);border-radius:15px;padding:15px 40px;color:#10203a;font-weight:900;font-size:18px;cursor:pointer}small{display:block;margin-top:16px;color:#a8b8da}#pause{position:fixed;bottom:24px;right:22px;border-radius:50%;width:50px;height:50px;padding:0;background:#ffffff25;color:white;font-size:21px;display:none}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="score">⭐ 0</span><span id="best">최고 0</span></div><button id="pause">Ⅱ</button><div id="overlay"><div class="card"><h1 id="title">🌠 별빛 대시</h1><p id="desc">손가락으로 우주선을 움직여<br>빨간 운석을 피하고 노란 별을 모으세요!<br>오래 살아남을수록 빨라집니다.</p><button id="start">게임 시작</button><small>모바일 터치 / PC 마우스·방향키 지원</small></div></div><script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),pauseBtn=document.querySelector('#pause');let W,H,dpr,player,items,particles,score,best=Number(localStorage.getItem('stardash-best')||0),running=false,paused=false,last=0,spawn=0,elapsed=0,keys={};bestEl.textContent='최고 '+best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);if(player){player.x=Math.min(W-25,player.x);player.y=H-100}}addEventListener('resize',resize);resize();
function begin(){player={x:W/2,y:H-105,r:19,target:W/2};items=[];particles=[];score=0;elapsed=0;spawn=0;running=true;paused=false;last=performance.now();overlay.style.display='none';pauseBtn.style.display='block';pauseBtn.textContent='Ⅱ';scoreEl.textContent='⭐ 0';requestAnimationFrame(loop)}
function end(){running=false;pauseBtn.style.display='none';if(score>best){best=score;localStorage.setItem('stardash-best',best)}bestEl.textContent='최고 '+best;document.querySelector('#title').textContent='💥 게임 종료';document.querySelector('#desc').innerHTML=`이번 점수 <b>${score}</b>점<br>최고 기록 <b>${best}</b>점<br>한 판 더 도전해 보세요!`;document.querySelector('#start').textContent='다시 시작';overlay.style.display='grid'}
function burst(px,py,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=Math.random()*4+1;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30,color})}}
function loop(t){if(!running)return;let dt=Math.min((t-last)/16.67,2);last=t;if(!paused){elapsed+=dt;spawn+=dt;let interval=Math.max(12,38-elapsed/100);if(spawn>interval){spawn=0;let star=Math.random()<.35;items.push({x:25+Math.random()*(W-50),y:-30,r:star?12:17+Math.random()*9,star,speed:(star?3.2:3.8)+elapsed/550+Math.random()*2,rot:Math.random()*6})}if(keys.ArrowLeft||keys.a)player.target-=8*dt;if(keys.ArrowRight||keys.d)player.target+=8*dt;player.target=Math.max(22,Math.min(W-22,player.target));player.x+=(player.target-player.x)*Math.min(1,.24*dt);for(let i=items.length-1;i>=0;i--){let o=items[i];o.y+=o.speed*dt;o.rot+=.035*dt;if(Math.hypot(o.x-player.x,o.y-player.y)<o.r+player.r-5){items.splice(i,1);if(o.star){score+=10;scoreEl.textContent='⭐ '+score;burst(o.x,o.y,'#fde68a')}else{burst(player.x,player.y,'#fb7185',25);end();break}}else if(o.y>H+40)items.splice(i,1)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)} }draw(t);if(running)requestAnimationFrame(loop)}
function draw(t){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1230');g.addColorStop(1,'#18244b');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<70;i++){let sx=(i*197.13)%W,sy=(i*371.31+(paused?0:t*.014*(i%3+1)))%H;x.globalAlpha=.25+(i%5)/10;x.fillStyle='white';x.fillRect(sx,sy,1.5,1.5)}x.globalAlpha=1;for(const o of items){x.save();x.translate(o.x,o.y);x.rotate(o.rot);if(o.star){x.fillStyle='#fde047';x.shadowColor='#facc15';x.shadowBlur=18;x.beginPath();for(let j=0;j<10;j++){let a=j*Math.PI/5-Math.PI/2,r=j%2?6:o.r;let px=Math.cos(a)*r,py=Math.sin(a)*r;j?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fill()}else{x.fillStyle='#f87171';x.shadowColor='#ef4444';x.shadowBlur=15;x.beginPath();for(let j=0;j<9;j++){let a=j*Math.PI*2/9,r=o.r*(.85+(j%3)*.09);j?x.lineTo(Math.cos(a)*r,Math.sin(a)*r):x.moveTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill();x.fillStyle='#9f303b';x.beginPath();x.arc(-5,-3,4,0,7);x.fill()}x.restore()}for(const p of particles){x.globalAlpha=Math.max(0,p.life/30);x.fillStyle=p.color;x.fillRect(p.x,p.y,4,4)}x.globalAlpha=1;if(player&&running){x.save();x.translate(player.x,player.y);x.shadowColor='#67e8f9';x.shadowBlur=20;x.fillStyle='#67e8f9';x.beginPath();x.moveTo(0,-24);x.lineTo(19,19);x.lineTo(0,10);x.lineTo(-19,19);x.closePath();x.fill();x.fillStyle='#fff';x.beginPath();x.arc(0,0,5,0,7);x.fill();x.restore()}if(paused){x.fillStyle='#0008';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='white';x.font='bold 30px system-ui';x.fillText('일시정지',W/2,H/2)}}
function move(e){if(!running||paused)return;player.target=e.clientX}c.addEventListener('pointerdown',move);c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)move(e)});addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '&&running)togglePause()});addEventListener('keyup',e=>keys[e.key]=false);function togglePause(){paused=!paused;pauseBtn.textContent=paused?'▶':'Ⅱ';last=performance.now()}pauseBtn.onclick=togglePause;document.querySelector('#start').onclick=begin;document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)togglePause()});draw(0);
</script></body></html>
